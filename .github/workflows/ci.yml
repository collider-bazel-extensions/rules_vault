name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  consumer:
    # rules_vault as a dependency, from the commit's git archive: a root
    # without vault.version() resolves, repeated / unsupported versions,
    # and @rules_vault//... loads.
    name: consumer (ubuntu-latest, git archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Consumer checks
        run: .github/consumer/check.sh "$RUNNER_TEMP/consumer"

  analysis:
    # Analysis tests, policy checks, checksum pins, and the hermetic
    # vault_server / vault_test suite (dev-mode vault from the pinned
    # release zip; no container runtime).
    name: bazel test (ubuntu-latest, hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-analysis
          repository-cache: true

      - name: Verify NO host vault on PATH
        run: |
          if command -v vault >/dev/null 2>&1; then
            echo "FAIL: vault found at $(command -v vault); the hermetic toolchain test would be meaningless" >&2
            exit 1
          fi

      # The per-platform toolchain targets would download every platform's
      # vault zip; //toolchain:current builds only the host's.
      - name: bazel build
        run: bazel build -- //... -//toolchain/... //toolchain:current

      - name: bazel test (hermetic)
        run: bazel test //... --build_tests_only --test_tag_filters=-manual --test_output=errors

      - name: Vault pins match HashiCorp's SHA256SUMS
        run: tools/update_checksums.sh --check

      - name: No vault processes left behind
        if: always()
        run: |
          if pgrep -x vault; then echo "FAIL: vault processes left running" >&2; exit 1; fi

      - name: Smoke composition builds
        run: bazel build //tests:smoke_test

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-analysis
          path: bazel-testlogs/
          if-no-files-found: ignore

  smoke:
    # End-to-end: kind + Vault (dev mode) + KV v2 round-trip.
    name: smoke (ubuntu-latest, dev mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-smoke
          repository-cache: true

      - name: Verify Docker is available
        run: docker version

      - name: bazel test //tests:smoke_test
        run: bazel test //tests:smoke_test --test_output=streamed --test_timeout=600

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-smoke
          path: bazel-testlogs/
          if-no-files-found: ignore

  smoke_ha:
    # End-to-end HA Raft: kind + Vault (3-replica HA Raft) +
    # init+unseal+raft-join orchestration + KV v2 round-trip via
    # leader (vault Service) and standby (vault-1.vault-internal).
    # 3 image pulls + 3 PVC mounts + the init/unseal sequence
    # take longer than dev mode — bumped timeout accordingly.
    name: smoke (ubuntu-latest, HA Raft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-smoke-ha
          repository-cache: true

      - name: Verify Docker is available
        run: docker version

      - name: bazel test //tests:smoke_test_ha
        run: bazel test //tests:smoke_test_ha --test_output=streamed --test_timeout=900

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-smoke-ha
          path: bazel-testlogs/
          if-no-files-found: ignore
